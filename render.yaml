services:
  - type: web
    name: engihub-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: engihub
      - key: CORS_ORIGINS
        value: https://engihub.xyz,https://engihub-sooty.vercel.app
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: STORAGE_QUOTA_MB
        value: "300"
      - key: APP_TZ
        value: Asia/Riyadh
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_IP_HEADER
        value: x-vercel-forwarded-for
